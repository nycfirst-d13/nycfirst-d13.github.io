<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D13 Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="play">
  <header class="top">
    <a class="brand" href="./">
      <img src="nycfirst-pixel.png" alt="NYC FIRST District 13" width="40" height="40">
      <span class="title">D13 Arcade</span>
    </a>
    <div class="play-meta" id="meta"></div>
    <div class="play-actions" id="actions"></div>
  </header>

  <main id="app"><div class="spinner"></div></main>

  <script src="app.js"></script>
  <script src="help.js"></script>
  <script>
    initHelp()
    const app = document.getElementById('app')
    const meta = document.getElementById('meta')
    const actions = document.getElementById('actions')

    function showGame(g) {
      meta.innerHTML =
        `<span class="g-title">${esc(g.game_title)}</span>` +
        `<span class="g-by">${esc(g.student_name)} · ${esc(gradeLabel(g.grade))}</span>`
      const src = g.student_url
        ? `<a class="btn" href="${esc(g.student_url)}" target="_blank" rel="noreferrer">See code <span class="ico">↗</span></a>`
        : ''
      actions.innerHTML =
        `<a class="btn" href="./"><span class="ico">←</span> Gallery</a>` +
        src +
        `<button class="btn" onclick="document.getElementById('stage').requestFullscreen()"><span class="ico">⛶</span> Fullscreen</button>`
      app.innerHTML =
        `<div class="stage" id="stage">
           <iframe src="${esc(g.d13_url)}" title="${esc(g.game_title)}" allow="autoplay; fullscreen" allowfullscreen></iframe>
         </div>`
      keepSimFocused(app.querySelector('iframe'))
    }

    // Two ways back to the gallery without a mouse — the arcade cabinet's
    // control panel covers the trackpad, so a keyboard-only exit is the only one
    // a player has.
    //   - Esc is handled by the browser above the focused frame, so it leaves
    //     fullscreen even while the game has the keys. Leaving fullscreen here
    //     means "done playing".
    //   - Esc as a plain keydown, for when the game hasn't taken focus yet (or
    //     we were never in fullscreen to begin with).
    let wasFullscreen = false
    addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) { wasFullscreen = true; return }
      if (wasFullscreen) location.href = './'
    })
    addEventListener('keydown', e => { if (e.key === 'Escape') location.href = './' })

    function showState(msg) {
      actions.innerHTML = `<a class="btn" href="./"><span class="ico">←</span> Gallery</a>`
      app.innerHTML = `<div class="state"><p class="pixel">${esc(msg)}</p></div>`
    }

    const id = new URLSearchParams(location.search).get('id') || ''
    if (!id) showState('Game not found.')
    else fetchGames()
      .then(games => {
        const g = findGame(games, id)
        g ? showGame(g) : showState('Game not found.')
      })
      .catch(() => showState("Couldn't load the game. Try again later."))
  </script>
</body>
</html>
