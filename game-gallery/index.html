<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D13 Game Gallery</title>
  <meta name="description" content="NYC FIRST District 13 — student MakeCode Arcade games">
  <link rel="stylesheet" href="style.css">
</head>
<body class="browse">
  <header class="top">
    <a class="brand" href="./">
      <img src="nycfirst-pixel.png" alt="NYC FIRST District 13" width="40" height="40">
      <span class="title">D13 Game Gallery</span>
    </a>
  </header>

  <main id="app">
    <div class="grid" id="skeleton">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="help.js"></script>
  <script src="kiosk.js"></script>
  <script>
    const app = document.getElementById('app')
    initHelp()

    function cardHtml(g) {
      const shareId = extractShareId(g.d13_url)
      const thumb = shareId ? thumbUrl(shareId) : 'nycfirst-pixel.png'
      const filled = g.grade === 'Instructor' || g.grade === 'Intern'
      const label = gradeLabel(g.grade)
      return `
        <a class="card" href="games.html?id=${encodeURIComponent(g.id)}">
          <img class="thumb" loading="lazy" src="${esc(thumb)}" alt="${esc(g.game_title)}"
               onerror="this.onerror=null;this.src='nycfirst-pixel.png'">
          <div class="body">
            <span class="name">${esc(g.game_title)}</span>
            <span class="who">${esc(g.student_name)}</span>
            <span class="badge ${filled ? 'filled' : ''}">${esc(label)}</span>
          </div>
        </a>`
    }

    function render(games) {
      if (!games.length) {
        app.innerHTML = `<div class="state"><p class="pixel">No games yet</p>
          <p>Nothing published yet — check back soon!</p></div>`
        return
      }
      app.innerHTML =
        `<div class="grid">${games.map(cardHtml).join('')}</div>
         <footer class="foot">
           <p class="count">${games.length} games published</p>
           <div class="xp"><span style="width:${Math.min(games.length, 100)}%"></span></div>
           <p class="made">Made with <a href="https://arcade.makecode.com" target="_blank" rel="noreferrer">MakeCode Arcade</a> at the NYC FIRST D13 STEM Center</p>
         </footer>`
      startKiosk(games)
      fitGrid()
    }

    // Size the grid so every card fits on one screen — pick the column count
    // that makes the largest reasonably-shaped cells; fixed rows fill the
    // height so nothing overflows. Too many games to fit → smallest usable
    // size with an (arcade-styled) scroll.
    function fitGrid() {
      const grid = document.querySelector('.grid')
      if (!grid || !grid.children.length) return
      const n = grid.children.length, gap = 18
      const cw = grid.clientWidth, ch = grid.clientHeight
      if (cw <= 0 || ch <= 0) return
      let best = null
      for (let c = 1; c <= n; c++) {
        const rows = Math.ceil(n / c)
        const cellW = (cw - (c - 1) * gap) / c
        const cellH = (ch - (rows - 1) * gap) / rows
        if (cellW < 140 || cellH < 140) continue
        const aspect = cellW / cellH
        if (aspect < 0.5 || aspect > 2.2) continue
        const area = cellW * cellH
        if (!best || area > best.area) best = { c, rows, area }
      }
      if (!best) {
        grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(180px, 1fr))'
        grid.style.gridTemplateRows = ''
        grid.style.overflowY = 'auto'
        return
      }
      grid.style.overflowY = 'hidden'
      grid.style.gridTemplateColumns = `repeat(${best.c}, 1fr)`
      grid.style.gridTemplateRows = `repeat(${best.rows}, 1fr)`
    }
    addEventListener('resize', fitGrid)

    function showError() {
      app.innerHTML = `<div class="state"><p class="pixel">Couldn't load games</p>
        <p>Check your connection and try again.</p>
        <p><button class="btn" onclick="load()">Retry</button></p></div>`
    }

    function load() {
      app.innerHTML = `<div class="grid">${'<div class="skel"></div>'.repeat(6)}</div>`
      fetchGames().then(render).catch(showError)
    }
    load()
  </script>
</body>
</html>
