<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D13 Game Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <img src="nycfirst-pixel.png" alt="NYC FIRST District 13" width="40" height="40">
      <span class="title">D13 Game Gallery</span>
    </a>
  </header>

  <main>
    <a class="btn back" href="./">← Back to gallery</a>
    <div id="app"><div class="spinner"></div></div>
  </main>

  <script src="app.js"></script>
  <script>
    const app = document.getElementById('app')

    function playerHtml(g) {
      const src = g.student_url
        ? `<a class="src" href="${esc(g.student_url)}" target="_blank" rel="noreferrer">Original submission →</a>`
        : ''
      return `
        <section class="player">
          <h1>${esc(g.game_title)}</h1>
          <div class="stage">
            <iframe src="${esc(g.d13_url)}" title="${esc(g.game_title)}" allowfullscreen
              sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
          </div>
          <p class="by">By <b>${esc(g.student_name)}</b> · ${esc(g.grade)}</p>
          ${src}
        </section>`
    }

    const state = msg =>
      app.innerHTML = `<div class="state"><p class="pixel">${esc(msg)}</p></div>`

    const id = new URLSearchParams(location.search).get('id') || ''
    if (!id) state('Game not found.')
    else fetchGames()
      .then(games => {
        const g = findGame(games, id)
        g ? app.innerHTML = playerHtml(g) : state('Game not found.')
      })
      .catch(() => state("Couldn't load the game. Try again later."))
  </script>
</body>
</html>
