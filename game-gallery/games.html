<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D13 Game Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="play">
  <header class="top">
    <a class="brand" href="./">
      <img src="nycfirst-pixel.png" alt="NYC FIRST District 13" width="40" height="40">
      <span class="title">D13 Game Gallery</span>
    </a>
    <div class="play-meta" id="meta"></div>
    <div class="play-actions" id="actions"></div>
  </header>

  <main id="app"><div class="spinner"></div></main>

  <script src="app.js"></script>
  <script src="help.js"></script>
  <script>
    initHelp()
    const app = document.getElementById('app')
    const meta = document.getElementById('meta')
    const actions = document.getElementById('actions')

    function showGame(g) {
      meta.innerHTML =
        `<span class="g-title">${esc(g.game_title)}</span>` +
        `<span class="g-by">${esc(g.student_name)} · ${esc(gradeLabel(g.grade))}</span>`
      const src = g.student_url
        ? `<a class="btn" href="${esc(g.student_url)}" target="_blank" rel="noreferrer">See code ↗</a>`
        : ''
      actions.innerHTML =
        `<a class="btn" href="./">← Gallery</a>` +
        src +
        `<button class="btn" onclick="document.getElementById('stage').requestFullscreen()">⛶ Fullscreen</button>`
      app.innerHTML =
        `<div class="stage" id="stage">
           <iframe src="${esc(g.d13_url)}" title="${esc(g.game_title)}" allowfullscreen
             sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
         </div>`
    }

    function showState(msg) {
      actions.innerHTML = `<a class="btn" href="./">← Gallery</a>`
      app.innerHTML = `<div class="state"><p class="pixel">${esc(msg)}</p></div>`
    }

    const id = new URLSearchParams(location.search).get('id') || ''
    if (!id) showState('Game not found.')
    else fetchGames()
      .then(games => {
        const g = findGame(games, id)
        g ? showGame(g) : showState('Game not found.')
      })
      .catch(() => showState("Couldn't load the game. Try again later."))
  </script>
</body>
</html>
